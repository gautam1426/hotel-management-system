<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARSHIL'S HOTEL - Management System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>HARSHIL'S HOTEL</h1>
            <p>Management System</p>
        </div>
    </header>

    <main class="container">
        <div class="dashboard">
            <div class="sidebar">
                <button class="tab-btn active" data-tab="rooms">Rooms</button>
                <button class="tab-btn" data-tab="bookings">Bookings</button>
                <button class="tab-btn" data-tab="add-room">Add Room</button>
                <button class="tab-btn" data-tab="checkout">Checkout</button>
            </div>

            <div class="content">
                <!-- Rooms Tab -->
                <div class="tab-content active" id="rooms">
                    <h2>Room Management</h2>
                    <div class="filter-options">
                        <button id="show-all">All Rooms</button>
                        <button id="show-available">Available Only</button>
                    </div>
                    <div class="rooms-grid" id="rooms-container">
                        <!-- Rooms will be dynamically inserted here -->
                    </div>
                </div>

                <!-- Bookings Tab -->
                <div class="tab-content" id="bookings">
                    <h2>Current Bookings</h2>
                    <table id="bookings-table">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Room No.</th>
                                <th>Type</th>
                                <th>Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Bookings will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>

                <!-- Add Room Tab -->
                <div class="tab-content" id="add-room">
                    <h2>Add New Room</h2>
                    <form id="add-room-form">
                        <div class="form-group">
                            <label for="room-number">Room Number</label>
                            <input type="number" id="room-number" required>
                        </div>
                        <div class="form-group">
                            <label for="room-type">Room Type</label>
                            <select id="room-type" required>
                                <option value="">Select Type</option>
                                <option value="Standard Single">Standard Single</option>
                                <option value="Standard Double">Standard Double</option>
                                <option value="Deluxe Suite">Deluxe Suite</option>
                                <option value="Executive Suite">Executive Suite</option>
                                <option value="Presidential Suite">Presidential Suite</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="room-price">Price per Night ($)</label>
                            <input type="number" id="room-price" required>
                        </div>
                        <button type="submit">Add Room</button>
                    </form>
                </div>

                <!-- Checkout Tab -->
                <div class="tab-content" id="checkout">
                    <h2>Customer Checkout</h2>
                    <form id="checkout-form">
                        <div class="form-group">
                            <label for="customer-name">Customer Name</label>
                            <input type="text" id="customer-name" required>
                        </div>
                        <button type="submit">Process Checkout</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Booking Modal -->
    <div class="modal" id="booking-modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Book Room</h2>
            <form id="booking-form">
                <input type="hidden" id="modal-room-number">
                <div class="form-group">
                    <label for="customer-name">Customer Name</label>
                    <input type="text" id="booking-customer-name" required>
                </div>
                <div class="room-info">
                    <p><strong>Room Type:</strong> <span id="modal-room-type"></span></p>
                    <p><strong>Price:</strong> $<span id="modal-room-price"></span>/night</p>
                </div>
                <button type="submit">Confirm Booking</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
